<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Базовое SEO-описание для поисковиков (Google) -->
    <meta name="description" content="Scaling your business through advanced IT." />
    
    <!-- Open Graph (для Telegram, Viber, LinkedIn, Facebook и других мессенджеров) -->
    <meta property="og:title" content="Efimovs Agency" />
    <meta property="og:description" content="Scaling your business through advanced IT." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://efimovs.agency/" />
    
    <!-- Twitter Cards (для Twitter/X и сервисов, использующих этот стандарт) -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Efimovs Agency" />
    <meta name="twitter:description" content="Scaling your business through advanced IT." />
    
    <!-- ПРИНУДИТЕЛЬНАЯ ЗАГРУЗКА LCP -->
    <link rel="preload" href="/preloader-emblem.webp" as="image" fetchpriority="high" />
    
    <!-- Исправленный фавикон с параметром ?v=2 для сброса кэша -->
    <link rel="icon" type="image/jpeg" sizes="any" href="/icons/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/icons/favicon.png?v=2" />
    
    <title>Efimovs Agency</title>
    
    <style>
      body { margin: 0; background-color: #000000; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
